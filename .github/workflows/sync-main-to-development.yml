name: Sync main to development

# Direct pushes/hotfixes (and release-please's own version-bump commits) land on main
# without ever touching development. This keeps development from drifting by opening
# a PR that merges main back in whenever main moves ahead.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Sync main into development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          AHEAD=$(git rev-list --count origin/development..origin/main)
          if [ "$AHEAD" -eq 0 ]; then
            echo "development is already up to date with main; nothing to sync."
            exit 0
          fi

          BRANCH="sync/main-to-development"
          git checkout -B "$BRANCH" origin/development
          git merge origin/main --no-edit

          git push origin "$BRANCH" --force

          if gh pr list --base development --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "Sync PR already open; branch push above updated it."
          else
            gh pr create --base development --head "$BRANCH" \
              --title "chore: sync main into development" \
              --body "Automated sync after a push to main (hotfix, direct push, or release-please version bump)."
          fi
