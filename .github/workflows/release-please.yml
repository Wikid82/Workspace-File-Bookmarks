name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish (e.g. v1.5.1). Only needed to manually
          (re)run the publish job for a release that already exists — e.g.
          after a packaging fix, when the tag itself predates the fix.
          Leave blank for a normal run.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when release-please actually cut a new release (i.e. a release PR was merged).
  # Chained onto this workflow (rather than triggered by the tag it pushes) because tags/releases
  # created via the default GITHUB_TOKEN do not trigger other workflows — a separate tag-triggered
  # workflow would silently never run.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
    steps:
      # On a normal run, release-please just created the release and handed us its tag/upload_url
      # directly. On a manual re-run (release already exists, e.g. retrying after a packaging fix),
      # those outputs are empty, so look the release up by the tag the user supplied instead.
      - name: Resolve release tag and upload URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            echo "tag=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "upload_url=${{ needs.release-please.outputs.upload_url }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.inputs.tag }}"
            UPLOAD_URL=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.upload_url')
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "upload_url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package extension
        run: npx @vscode/vsce package

      # CycloneDX SBOM covering every prod dependency in the packaged .vsix, for
      # downstream vulnerability/license auditing without re-resolving the tree.
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom.cdx.json

      # Cryptographically binds the .vsix and its SBOM to this workflow run and
      # commit (Sigstore-backed, keyless — no secrets to manage). Verify with:
      #   gh attestation verify <file> -R ${{ github.repository }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: '*.vsix, sbom.cdx.json'

      # release-please-config.json sets draft:true for this package specifically so this step can
      # run at all: GitHub's immutable-releases feature locks a release the instant it's published,
      # so assets can only be attached while it's still a draft. We un-draft it in the next step,
      # once the vsix is safely attached.
      #
      # GitHub's "get release by tag" API doesn't resolve drafts, so `gh release upload <tag>`
      # can't find this release yet. Using upload_url (which release-please-action already gives
      # us straight from the create-release response) sidesteps that lookup entirely.
      #
      # Lets users grab the .vsix straight from the GitHub Release and "Install from VSIX...",
      # no Marketplace/Open VSX account or token needed for this path.
      #
      # Only meaningful right after release-please creates the (draft) release. On a manual
      # re-run the release is already published and non-draft, so attaching again would just
      # 422 on the duplicate asset name — skip both steps in that case.
      - name: Attach VSIX and SBOM to GitHub Release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.resolve.outputs.upload_url }}
        run: |
          BASE_URL="${UPLOAD_URL%%\{*}"
          for ASSET in *.vsix sbom.cdx.json; do
            curl -sSf -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${ASSET}" \
              "${BASE_URL}?name=${ASSET}"
          done

      - name: Publish GitHub Release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.resolve.outputs.upload_url }}
        run: |
          RELEASE_ID=$(echo "${UPLOAD_URL}" | sed -E 's#.*/releases/([0-9]+)/.*#\1#')
          gh api -X PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" -f draft=false

      # Publishes to the official VS Code Marketplace (skipped until VS_MARKETPLACE_TOKEN is set).
      # continue-on-error so a failure here (e.g. re-running on an already-published version)
      # doesn't prevent the independent Open VSX step below from running.
      - name: Publish to Visual Studio Marketplace
        if: ${{ env.VS_MARKETPLACE_TOKEN != '' }}
        continue-on-error: true
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
        with:
          pat: ${{ env.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com

      # Publishes to Open VSX Registry (skipped until OPEN_VSX_TOKEN is set)
      - name: Publish to Open VSX Registry
        if: ${{ env.OPEN_VSX_TOKEN != '' }}
        continue-on-error: true
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
        with:
          pat: ${{ env.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
