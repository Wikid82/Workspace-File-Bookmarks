name: Bug report
description: Something in Workspace File Bookmarks isn't working as expected
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we see this ourselves?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown on the extension's page in the Extensions panel
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help > About (or `code --version`)
      placeholder: e.g. 1.125.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS/platform
      description: e.g. macOS 14, Windows 11, Ubuntu 22.04
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output from Help > Toggle Developer Tools > Console, if any
      render: shell
    validations:
      required: false
